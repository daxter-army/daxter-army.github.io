name: Build and publish hosting branch

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # allows the Action to push to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish build to hosting branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "Skipping a superseded source commit."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          build_dir="$(mktemp -d)"
          cp -R docs/. "$build_dir/"
          rm -rf docs

          if git ls-remote --exit-code --heads origin hosting; then
            git fetch origin hosting:hosting
            git switch hosting
          else
            git switch --orphan hosting
          fi

          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$build_dir"/. .
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No build changes to publish."
            exit 0
          fi

          git commit -m "chore: publish build [skip ci]"
          git push origin hosting
